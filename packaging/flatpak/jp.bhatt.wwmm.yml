id: jp.bhatt.wwmm
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
# GNOME Sdk//49 is built on org.freedesktop.Sdk//25.08 (confirmed via
# `flatpak info --show-metadata org.gnome.Sdk//49 | grep freedesktop`), so
# the SDK extension branch below must match 25.08, not the GNOME version.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: integrated-mod-manager
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=home
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: xdg-utils
    buildsystem: simple
    sources:
      - type: file
        path: xdg-utils/xdg-mime
      - type: file
        path: xdg-utils/xdg-open
      - type: file
        path: xdg-utils/xdg-settings
    build-commands:
      - install -Dm755 xdg-mime /app/bin/xdg-mime
      - install -Dm755 xdg-open /app/bin/xdg-open
      - install -Dm755 xdg-settings /app/bin/xdg-settings

  - name: imm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
      env:
        CARGO_HOME: /run/build/imm/cargo
        CARGO_NET_OFFLINE: 'true'
        XDG_CACHE_HOME: /run/build/imm/flatpak-node/cache
        npm_config_cache: /run/build/imm/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - npm --prefix repo ci --offline
      - npm --prefix repo run build
      # tauri/custom-protocol is what makes the binary embed and serve the
      # bundled frontend instead of pointing the webview at devUrl
      # (http://localhost:3420). `tauri build` (the CLI) enables it
      # automatically; calling cargo directly, we have to pass it ourselves
      # or the packaged app launches to a blank "connection refused" window.
      - cd repo/src-tauri && cargo build --release --offline --features tauri/custom-protocol
      - install -Dm755 repo/src-tauri/target/release/integrated-mod-manager /app/bin/integrated-mod-manager
      - install -Dm644 repo/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/jp.bhatt.wwmm.png
      - install -Dm644 jp.bhatt.wwmm.desktop /app/share/applications/jp.bhatt.wwmm.desktop
      - install -Dm644 jp.bhatt.wwmm.metainfo.xml /app/share/metainfo/jp.bhatt.wwmm.metainfo.xml
      # Tauri resolves BaseDirectory::Resource to /app/lib/${productName}, where
      # productName is "Integrated Mod Manager (IMM)" (see src-tauri/tauri.conf.json).
      # These MUST match that dir or 7zz won't be found at runtime (extract → os error 2).
      - install -Dm755 7zz-x64/7zz "/app/lib/Integrated Mod Manager (IMM)/ext/7zz"
      - install -Dm755 7zz-arm64/7zz "/app/lib/Integrated Mod Manager (IMM)/ext/7zz-aarch64"
    sources:
      # Pinned to a public commit (not a local `type: dir` copy) so the build is
      # actually reproducible from source and store frontends like Bazaar can
      # verify it against public source instead of flagging it as unauditable.
      # Bump this commit when cutting a new release.
      - type: git
        url: https://github.com/Antonzlo/integrated-mod-manager.git
        commit: a7acec0694c6a4bcd4aa74089ace6abe415bdd86
        dest: repo
      # Generated by flatpak-cargo-generator.py / flatpak-node-generator.py, see
      # packaging/flatpak/README.md for how to regenerate.
      - cargo-sources.json
      - npm-sources.json
      - type: file
        path: jp.bhatt.wwmm.desktop
      - type: file
        path: jp.bhatt.wwmm.metainfo.xml
      # Official 7-Zip 26.00 release archives instead of committing the binaries to git.
      # x64 sha256 verified to extract a 7zz binary byte-identical to the previously
      # committed src-tauri/ext/7zz. arm64 is dynamically-linked (previous commit was
      # static), still same 7-Zip 26.00, works fine against the runtime's loader/libc.
      # strip-components: 0 because these tarballs have no wrapping top-level dir
      # (flatpak-builder's archive extraction defaults to stripping 1, which would
      # silently drop every top-level file including 7zz itself).
      - type: archive
        archive-type: tar-xz
        url: https://www.7-zip.org/a/7z2600-linux-x64.tar.xz
        sha256: c74dc4a48492cde43f5fec10d53fb2a66f520e4a62a69d630c44cb22c477edc6
        strip-components: 0
        dest: 7zz-x64
      - type: archive
        archive-type: tar-xz
        url: https://www.7-zip.org/a/7z2600-linux-arm64.tar.xz
        sha256: aa8f3d0a19af9674d3af0ec788b4e261501071e626cd75ad149f1c2c176cc87d
        strip-components: 0
        dest: 7zz-arm64
