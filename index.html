<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WuWa Mod Manager</title>
	</head>

	<body>
		<div id="root" class="w-full h-full"></div>
		<script type="module" src="/src/main.tsx"></script>
	<script>(async () => {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const log = (...a) => console.info("[PERF]", ...a);
  const findScroller = () => {
    const c = document.querySelector(".card-online");
    for (let e = c && c.parentElement; e; e = e.parentElement) {
      const s = getComputedStyle(e);
      if ((s.overflowY === "auto" || s.overflowY === "scroll") && e.scrollHeight > e.clientHeight) return e;
    }
    return null;
  };
  log("bench script loaded");
  let sc = null;
  for (let i = 0; ; i++) {
    await sleep(1000);
    const n = document.querySelectorAll(".card-online img").length;
    if (i % 5 === 0) log("waiting; card-online", document.querySelectorAll(".card-online").length, "imgs", n);
    if (n >= 4 && (sc = findScroller())) break;
  }
  await sleep(4000);
  const ua = navigator.userAgent.match(/AppleWebKit\/[\d.]+/);
  log("start", ua && ua[0], "cards", document.querySelectorAll(".card-online").length, "imgs", document.querySelectorAll(".card-online img").length, "scrollH", sc.scrollHeight, "clientH", sc.clientHeight);
  const style = document.createElement("style");
  document.head.appendChild(style);
  const B = ".card-online [class*=backdrop-blur],.card-online[class*=backdrop-blur]{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transform:none!important}";
  const F = ".card-online img{filter:none!important}";
  const A = ".card-online,.card-online *{animation:none!important;transition:none!important}";
  const I = ".card-online img:nth-of-type(2){display:none!important}";
  sc.setAttribute("data-bench", "1");
  const V = {
    baseline: "",
    hideCards: ".card-online,.card-online *{visibility:hidden!important}",
    hideScrollerContent: "[data-bench]>*{visibility:hidden!important}",
    hideFixedLayers: ".fixed{display:none!important}",
    containCards: ".card-generic{contain:strict!important}",
    containGrid: ".card-grid{contain:layout paint!important}",
    baseline2: "",
  };
  async function run(name) {
    style.textContent = V[name];
    sc.scrollTop = 0;
    await sleep(800);
    const d = [];
    let last = performance.now();
    const t0 = last;
    let up = false;
    let sync = 0, nscroll = 0;
    await new Promise((res) => {
      function f(t) {
        d.push(t - last);
        last = t;
        const ph = (t - t0) % 500; // 350ms scroll burst, 150ms pause (lets the 50ms debounce fire)
        if (ph < 350) {
          const max = sc.scrollHeight - sc.clientHeight;
          const a = performance.now();
          sc.scrollTop += up ? -14 : 14;
          void sc.scrollHeight;
          sync += performance.now() - a;
          nscroll++;
          if (sc.scrollTop >= max - 5) up = true;
          if (sc.scrollTop <= 0) up = false;
        }
        t - t0 < 8000 ? requestAnimationFrame(f) : res();
      }
      requestAnimationFrame(f);
    });
    d.shift();
    d.sort((a, b) => a - b);
    const q = (p) => d[Math.floor(p * (d.length - 1))].toFixed(1);
    const bad = d.filter((x) => x > 25).length;
    log(name, "frames", d.length, "p50", q(0.5), "p95", q(0.95), "p99", q(0.99), "max", d[d.length - 1].toFixed(0), ">25ms", bad, "syncLayoutMsPerScrollFrame", (sync / Math.max(1, nscroll)).toFixed(1));
  }
  for (const n of Object.keys(V)) await run(n);
  log("done");
})();
</script>
	</body>
</html>
